name: Release Plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target release tag (leave empty for latest release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-attach-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build clean WordPress plugin package
        run: |
          mkdir -p build/netfett-maintenance
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='*.bak' \
            --exclude='build' \
            ./ build/netfett-maintenance/
          cd build
          zip -r netfett-maintenance.zip netfett-maintenance/

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "Target release tag is: $TAG"
          gh release upload "$TAG" build/netfett-maintenance.zip --clobber
